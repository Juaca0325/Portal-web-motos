
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario de Motos Alto cc y Medio cc</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>Portal de Motos Alto y Medio Cilindraje</h1>

    <nav>
        <ul>
            <li><a href="Alto_cc.html">Alto CC</a></li>
            <li><a href="Medio_cc.html">Medio CC</a></li>
            <li><a href="form.html">Formulario</a></li>
        </ul>
    </nav>

</header>

<div class="datosContainer">

    <h1>Registro de Moto Deportiva</h1>

    <!-- FORMULARIO -->
    <form id="formularioMotos">

        <h2>Datos del Comprador</h2>

        <p>
            <label for="nombre">Nombre completo:</label><br>
            <input type="text" id="nombre" name="usuario_nombre"
                placeholder="Escribe tu nombre completo" required>
        </p>

        <p>
            <label for="email">Correo Electrónico:</label><br>
            <input type="email" id="email" name="usuario_email" required>
        </p>

        <p>
            <label for="edad">Edad:</label><br>
            <input type="number" id="edad" name="usuario_edad" min="18" max="100" required>
        </p>

        <p>
            <label for="pais">País de residencia:</label><br>
            <select id="pais" name="usuario_pais" required>
                <option value="">Seleccione un país</option>
                <option value="Colombia">Colombia</option>
                <option value="Argentina">Argentina</option>
                <option value="España">España</option>
                <option value="Estados Unidos">Estados Unidos</option>
                <option value="Chile">Chile</option>
                <option value="Brasil">Brasil</option>
            </select>
        </p>

        <h2>Datos de la Moto</h2>

        <p>
            <label for="marca">Marca:</label><br>
            <select id="marca" name="moto_marca" required>
                <option value="">Seleccione una marca</option>
                <option value="Yamaha">Yamaha</option>
                <option value="Kawasaki">Kawasaki</option>
                <option value="Honda">Honda</option>
                <option value="Suzuki">Suzuki</option>
                <option value="BMW">BMW</option>
                <option value="Bajaj">Bajaj</option>
                <option value="Hero">Hero</option>
                <option value="Ducati">Ducati</option>
            </select>
        </p>

        <p>
            <label for="modelo">Modelo:</label><br>
            <input type="text" id="modelo" name="moto_modelo"
                placeholder="Ej: CB190R, S1000RR, NS200..." required>
        </p>

        <p>
            <label for="cc">Cilindraje (CC):</label><br>
            <input type="number" id="cc" name="moto_cc" min="100" max="1300" required>
        </p>

        <p>
            <label for="color">Color:</label><br>
            <input type="color" id="color" name="moto_color">
        </p>

        <p>
            <label for="anio">Año del modelo:</label><br>
            <input type="number" id="anio" name="moto_anio" min="2000" max="2026" required>
        </p>

        <p>
            <span>Tipo de combustible:</span><br>

            <input type="radio" id="gasolina" name="combustible"
                value="Gasolina" required>

            <label for="gasolina">Gasolina</label>

            <input type="radio" id="electrica" name="combustible"
                value="Electrica">

            <label for="electrica">Eléctrica</label>
        </p>

        <p>
            <span>Transmisión:</span><br>

            <input type="radio" id="manual" name="transmision"
                value="Manual" required>

            <label for="manual">Manual</label>

            <input type="radio" id="automatica" name="transmision"
                value="Automatica">

            <label for="automatica">Automática</label>
        </p>

        <p>
            <label for="extras">Accesorios adicionales:</label><br>

            <textarea id="extras" name="moto_extras"
                rows="4" cols="40"
                placeholder="Ej: Escape deportivo, sliders, luces LED..."></textarea>
        </p>

        <p>
            <input type="submit" value="Registrar Moto">
        </p>

    </form>

    <!-- RESULTADO DINÁMICO -->
    <div id="resultadoFormulario"></div>

</div>

<footer>

    <p>© 2026 Portal de Motos - Juan Camilo</p>

    <p>Contacto: motos@altocc.com</p>

</footer>



<!-- ==========================================
     JAVASCRIPT DEL FORMULARIO
========================================== -->

<script>

    // ==========================================
    // CAPTURA DE ELEMENTOS DEL DOM
    // ==========================================

    const formularioMotos = document.getElementById("formularioMotos");

    const nombre = document.getElementById("nombre");
    const email = document.getElementById("email");
    const edad = document.getElementById("edad");
    const pais = document.getElementById("pais");

    const marca = document.getElementById("marca");
    const modelo = document.getElementById("modelo");
    const cc = document.getElementById("cc");
    const color = document.getElementById("color");
    const anio = document.getElementById("anio");

    const extras = document.getElementById("extras");

    const resultadoFormulario = document.getElementById("resultadoFormulario");


    // ==========================================
    // EVENTO SUBMIT
    // ==========================================

    formularioMotos.addEventListener("submit", function(event){

        // Evita que la página recargue automáticamente
        event.preventDefault();


        // ==========================================
        // CAPTURA DE DATOS
        // ==========================================

        const nombreUsuario = nombre.value;
        const correoUsuario = email.value;
        const edadUsuario = edad.value;
        const paisUsuario = pais.value;

        const marcaMoto = marca.value;
        const modeloMoto = modelo.value;
        const ccMoto = cc.value;
        const colorMoto = color.value;
        const anioMoto = anio.value;

        const accesoriosMoto = extras.value;


        // ==========================================
        // CAPTURA RADIO BUTTONS
        // ==========================================

        const combustible = document.querySelector('input[name="combustible"]:checked').value;

        const transmision = document.querySelector('input[name="transmision"]:checked').value;


        // ==========================================
        // MOSTRAR INFORMACIÓN EN PANTALLA
        // ==========================================

        resultadoFormulario.innerHTML = `

            <div style="
    margin-top: 20px;
    padding: 20px;
    background-color: white;
    color: black;
    border-radius: 10px;
    border: 2px solid #cccccc;

            ">

                <h2> Registro Exitoso</h2>

                <h3> Datos del Comprador</h3>

                <p><strong>Nombre:</strong> ${nombreUsuario}</p>

                <p><strong>Correo:</strong> ${correoUsuario}</p>

                <p><strong>Edad:</strong> ${edadUsuario}</p>

                <p><strong>País:</strong> ${paisUsuario}</p>

                <hr>

                <h3> Datos de la Moto</h3>

                <p><strong>Marca:</strong> ${marcaMoto}</p>

                <p><strong>Modelo:</strong> ${modeloMoto}</p>

                <p><strong>Cilindraje:</strong> ${ccMoto} cc</p>

                <p><strong>Año:</strong> ${anioMoto}</p>

                <p><strong>Combustible:</strong> ${combustible}</p>

                <p><strong>Transmisión:</strong> ${transmision}</p>

                <p><strong>Accesorios:</strong> ${accesoriosMoto}</p>

                <p>
                    <strong>Color Seleccionado:</strong>

                    <span style="
                        display: inline-block;
                        width: 20px;
                        height: 20px;
                        background: ${colorMoto};
                        border: 1px solid black;
                        vertical-align: middle;
                    "></span>
                </p>

            </div>
        `;


        // ==========================================
        // ALERTA INTERACTIVA
        // ==========================================

        alert("Formulario procesado correctamente");


        // ==========================================
        // LIMPIAR FORMULARIO
        // ==========================================

        formularioMotos.reset();

    });

</script>

</body>
</html>
